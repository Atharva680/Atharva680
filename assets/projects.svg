ont-size="13" font-weight="bold" fill="#000000" >06 / atharva-portfolio</text><text x="40" y="461" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="normal" fill="#5f6368" >Professional portfolio focused on AI, data engineering, computer vision, and development journey.</text><text x="40" y="479" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="1">TYPESCRIPT</text><line x1="40" y1="490" x2="860" y2="490" stroke="#aeb4ba" stroke-width="1"/><text x="40" y="502" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#000000" >07 / Python--185</text><text x="40" y="523" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="normal" fill="#5f6368" >185+ Python exercises and projects, spanning syntax through advanced data structures.</text><text x="40" y="541" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="1">PYTHON</text><line x1="40" y1="552" x2="860" y2="552" stroke="#aeb4ba" stroke-width="1"/><text x="40" y="564" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#000000" >08 / Master-DSA-Sheet-500-</text><text x="40" y="585" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="normal" fill="#5f6368" >Full DSA track with first solves and two revision passes for long-term retention.</text><text x="40" y="603" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="1">—</text><line x1="40" y1="614" x2="860" y2="614" stroke="#aeb4ba" stroke-width="1"/><text x="40" y="626" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#000000" >09 / mern-stack-technical-assignment</text><text x="40" y="647" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="normal" fill="#5f6368" >Full-stack application demonstrating REST API design and responsive frontend development.</text><text x="40" y="665" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="1">MERN</text><line x1="40" y1="676" x2="860" y2="676" stroke="#aeb4ba" stroke-width="1"/><text x="40" y="688" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#000000" >10 / Face-Image-Deduplication-Tool</text><text x="40" y="709" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="normal" fill="#5f6368" >Face-image deduplication using face detection and perceptual hashing to organize folders.</text><text x="40" y="727" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="1">PYTHON</text><line x1="40" y1="738" x2="860" y2="738" stroke="#aeb4ba" stroke-width="1"/><text x="40" y="750" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#000000" >11 / Face-Recognition-Attendance-System-High-Accuracy-</text><text x="40" y="771" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="normal" fill="#5f6368" >Offline attendance system built with Python, OpenCV, dlib, and face_recognition.</text><text x="40" y="789" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="1">PYTHON</text><line x1="40" y1="800" x2="860" y2="800" stroke="#aeb4ba" stroke-width="1"/><text x="40" y="812" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#000000" >12 / FaceGuard-UI</text><text x="40" y="833" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="normal" fill="#5f6368" >Production-ready real-time face detection, smart capture, and event recording system.</text><text x="40" y="851" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="1">PYTHON</text><line x1="40" y1="862" x2="860" y2="862" stroke="#aeb4ba" stroke-width="1"/><text x="40" y="874" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#000000" >13 / -Data-Engineering-Assignment-Stock-Data-Monthly-Resampling-and-Technical-Indicators</text><text x="40" y="895" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="normal" fill="#5f6368" >Stock-market data pipeline with monthly resampling and technical indicators for forecasting.</text><text x="40" y="913" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="1">PYTHON</text><line x1="40" y1="924" x2="860" y2="924" stroke="#aeb4ba" stroke-width="1"/><text x="40" y="936" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="bold" fill="#000000" >14 / F1-Championship-Simulator</text><text x="40" y="957" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="normal" fill="#5f6368" >Monte Carlo simulator for full-season F1 standings with interactive dashboards.</text><text x="40" y="975" font-family="Courier New,ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" font-weight="bold" fill="#000000" letter-spacing="1">JUPYTER NOTEBOOK</text><line x1="40" y1="986" x2="860" y2="986" stroke="#aeb4ba" stroke-width="1"/><text x="40" y="998" font-family="Courier New,ui-monospace,SFMono-Regul